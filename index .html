<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roket Boarding</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
:root{color-scheme:light;--bg:#F4F6FB;--ink:#0F1F4B;--mu:#4A5578;--ln:#DDE3F0;--card:#fff;--in:#B8C2DE;--soft:#E6EBF8;--okb:#DDF3EC;--okt:#0B5A49;--wb:#FFE7D6;--wt:#8A3A06;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0A1433;--ink:#EEF1FB;--mu:#B4BEDD;--ln:#27345F;--card:#121E45;--in:#4A5A8C;--soft:#1B2A5C;--okb:#0B3B31;--okt:#9BE5D0;--wb:#4A2A12;--wt:#FFC9A3}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0A1433;--ink:#EEF1FB;--mu:#B4BEDD;--ln:#27345F;--card:#121E45;--in:#4A5A8C;--soft:#1B2A5C;--okb:#0B3B31;--okt:#9BE5D0;--wb:#4A2A12;--wt:#FFC9A3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;line-height:1.1}h1{font-size:36px}h2{font-size:24px}h3{font-size:18px}
p{margin:0}button{font-family:inherit;cursor:pointer;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh}
main{padding:20px 20px 120px;display:flex;flex-direction:column;gap:16px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:8px 16px}.cp{padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}.m{color:var(--mu);font-size:14px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.r{display:flex;align-items:center;gap:12px;padding:10px 0}.r+.r{border-top:1px solid var(--ln)}.g{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.btn{min-height:52px;border:0;border-radius:14px;background:#F26B21;color:#0F1F4B;font:700 16px 'Space Grotesk',sans-serif;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.b2{background:transparent;border:2px solid var(--ink);color:var(--ink)}.sm{min-height:44px;width:auto;padding:0 16px;font-size:14px}
.hero{background:#0F1F4B;color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}.hero .lbl{color:#C5CFEE}
.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.in{min-height:52px;border:1.5px solid var(--in);border-radius:14px;padding:0 14px;font:400 16px Inter,sans-serif;color:var(--ink);background:var(--card);box-sizing:border-box;width:100%}
textarea.in{padding:12px 14px;min-height:96px}.in::placeholder{color:var(--mu)}
.pl{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:4px 10px;font:600 12px Inter,sans-serif;border:0}.pb{min-height:44px;padding:0 14px}
.ok{background:var(--okb);color:var(--okt)}.wt{background:var(--wb);color:var(--wt)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--ln);padding:8px 8px calc(14px + env(safe-area-inset-bottom,0px))}
.nav>div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;min-height:52px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px Inter,sans-serif;color:var(--mu)}
.nav i{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav .on{color:var(--ink)}.nav .on i{background:#F26B21;color:#0F1F4B}
.qrbox{background:#fff;border-radius:20px;padding:14px;align-self:center;width:260px;max-width:100%;box-sizing:border-box}.qrbox svg{width:100%;height:auto;display:block}
.ban{border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;text-align:center}
.cam{position:relative;border-radius:24px;overflow:hidden;background:#0A1433;aspect-ratio:1/1}.cam video{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#0F1F4B;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:9;max-width:90%}
.login{min-height:100vh;background:#0F1F4B;display:flex;flex-direction:column;color:#fff}
.login .top{padding:56px 24px 28px;display:flex;flex-direction:column;gap:18px}
.sheet{margin-top:auto;background:var(--card);color:var(--ink);border-radius:28px 28px 0 0;padding:28px 20px 36px;display:flex;flex-direction:column;gap:14px}
form{display:flex;flex-direction:column;gap:12px}

/* Ajustes visuales y de accesibilidad */
:root{
  --accent:#ff7a2f;
  --accent-dark:#e85f18;
  --shadow:0 12px 32px rgba(15,31,75,.08);
}
*{box-sizing:border-box}
body{
  background:
    radial-gradient(ellipse at 12% 0%,rgba(255,122,47,.10),transparent 34rem),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
#app{max-width:560px}
main{padding:24px 18px 118px;gap:18px}
h1{font-size:clamp(30px,8vw,42px);letter-spacing:-.04em}
h2{font-size:25px;letter-spacing:-.025em}
h3{font-size:19px;letter-spacing:-.015em;margin-top:4px}
.card{
  border-radius:22px;
  padding:10px 18px;
  box-shadow:var(--shadow);
  transition:transform .18s ease,box-shadow .18s ease;
}
.card.cp{padding:18px;gap:14px}
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#101f4b 0%,#1b3470 100%);
  padding:25px;border-radius:26px;
  box-shadow:0 16px 34px rgba(15,31,75,.18);
}
.hero:after{
  content:"";position:absolute;width:190px;height:190px;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);right:-75px;top:-85px;
  box-shadow:0 0 0 22px rgba(255,255,255,.035),0 0 0 46px rgba(255,255,255,.025);
  pointer-events:none;
}
.btn{
  background:linear-gradient(135deg,#ff873f,#f26b21);
  color:#14234d;border-radius:15px;min-height:50px;
  box-shadow:0 7px 16px rgba(242,107,33,.18);
  transition:transform .15s ease,filter .15s ease,box-shadow .15s ease;
}
.btn:hover{filter:brightness(1.03);box-shadow:0 9px 20px rgba(242,107,33,.24)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.b2{
  background:var(--card);color:var(--ink);border:1.5px solid var(--ln);
  box-shadow:none;
}
.btn.b2:hover{background:var(--soft)}
.in{
  min-height:50px;border-radius:13px;border:1.5px solid var(--ln);
  transition:border-color .15s ease,box-shadow .15s ease;
}
.in:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,122,47,.15);
}
.f{gap:7px}
.lbl{letter-spacing:.07em;font-size:11px}
.r{padding:12px 0}
.ic{border-radius:14px}
.nav{
  background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 -8px 24px rgba(15,31,75,.05);
  padding-top:10px;
}
.nav button{font-size:11px;gap:3px}
.nav i{transition:background .15s ease}
.nav .on i{background:rgba(255,122,47,.18);color:var(--accent-dark)}
.pl{font-size:11px}
.toast{
  bottom:calc(105px + env(safe-area-inset-bottom,0px));
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  animation:toastIn .2s ease-out;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.login{
  background:
    radial-gradient(circle at 85% 8%,rgba(255,122,47,.28),transparent 14rem),
    linear-gradient(145deg,#0f1f4b,#1b3470);
}
.login .top{padding:54px 24px 32px}
.sheet{box-shadow:0 -12px 36px rgba(0,0,0,.12);gap:16px}
.cam{border:1px solid var(--ln);box-shadow:var(--shadow)}
button:focus-visible,[role=button]:focus-visible{
  outline:3px solid rgba(255,122,47,.55);outline-offset:3px
}
@media(min-width:520px){
  body{padding:20px 0}
  #app{min-height:calc(100vh - 40px);background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 18px 60px rgba(15,31,75,.10)}
  .nav{left:50%;transform:translateX(-50%);width:min(560px,100%);border-radius:0 0 28px 28px}
}
@media(min-width:760px){
  body{padding:24px 28px;min-height:100vh}
  #app{width:100%;max-width:1180px;min-height:calc(100vh - 48px);margin:0 auto;border:1px solid var(--ln);border-radius:28px;overflow:hidden;background:var(--bg);box-shadow:0 22px 70px rgba(15,31,75,.12)}
  main{max-width:1120px;margin:0 auto;padding:34px 34px 126px;gap:22px}
  .hd{padding-bottom:8px}
  .nav{left:50%;transform:translateX(-50%);width:min(1180px,calc(100% - 56px));border-radius:0 0 28px 28px;padding-left:24px;padding-right:24px}
  .nav>div{max-width:1120px;margin:0 auto;justify-content:center;gap:8px}
  .nav button{max-width:170px;min-width:110px;font-size:12px}
  .card{padding:14px 22px}
  .card.cp{padding:22px}
  .hero{padding:34px}
  .login{min-height:calc(100vh - 48px);max-width:none;align-items:center;justify-content:center;padding:48px 24px;gap:28px}
  .login .top{width:min(560px,100%);padding:24px 12px 0}
  .sheet{width:min(560px,100%);margin:0;border-radius:28px;padding:32px}
}
@media(min-width:1100px){
  main{padding-left:48px;padding-right:48px}
  .nav{width:min(1180px,calc(100% - 56px))}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}

</style>

</div>
<script>
const P={home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',qr:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z',users:'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14a7 7 0 0 1 4 6',map:'M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',chart:'M4 20V10M10 20V4M16 20v-8M22 20H2',check:'M5 12.5l4.5 4.5L19 7.5',x:'M6 6l12 12M18 6L6 18',bell:'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',scan:'M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10',note:'M6 4h12v17H6zM9 9h6M9 13h6M9 17h3',file:'M7 3h7l5 5v13H7zM14 3v5h5',lock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3',rocket:'M12 2c3 2 5 6 5 10l-2 4H9l-2-4c0-4 2-8 5-10zM9 16l-3 4 4-1M15 16l3 4-4-1'};
const ic=(n,s=22,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={g(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},d(k){try{localStorage.removeItem(k)}catch(e){}}};
const themeSaved=ls.g('rb_theme');

applyTheme(themeSaved==='dark'?'dark':themeSaved==='light'?'light':(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));

const ROLE_CODES={coordinador:'5677',admin:'8151'};

const H=async(d,p)=>{if(window.crypto&&crypto.subtle){try{return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d+':'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}}let h1=0xdeadbeef,h2=0x41c6ce57;const t=d+':'+p;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 'f'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16)};
function dlf(n,t,txt){
  try{
    const blob=new Blob([txt],{type:t+';charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=n;a.style.display='none';

}
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'}):'';
const vals=o=>Object.values(S[o]);

const fld=(l,n,t='text',x='')=>`<label class="f">${l}<input class="in" name="${n}" type="${t}" ${x}></label>`;
const sel=(l,n,o)=>`<label class="f">${l}<select class="in" name="${n}">${o}</select></label>`;
const rw=(i,l,v,x='')=>`<div class="r"><span class="ic">${ic(i)}</span><div class="g"><span class="lbl">${l}</span><b>${v}</b></div>${x}</div>`;

const tripOpts=b=>b+vals('t').map(t=>`<option value="${t.id}">${E(t.dest)} · ${fd(t.date)}</option>`).join('');
const brand=`<div class="row"><span class="ic" style="background:#F26B21;color:#0F1F4B">${ic('rocket',24)}</span><b style="font:700 20px 'Space Grotesk',sans-serif">Roket Boarding</b></div>`;
function authView(mode){const setup=mode==='setup',signup=mode==='signup';return `<div class="login"><div class="top"><div class="row sp">${brand}${themeButton()}</div><h1 style="margin-top:28px">${setup?'Configuración inicial':signup?'Crear una cuenta':'Tu viaje de egresados, bajo control.'}</h1><p style="color:#C5CFEE">${setup?'Creá la primera cuenta de Administrador. Requiere el código 8151.':signup?'Elegí tu rol. Coordinador requiere 5677 y Administrador 8151.':'Ingresá con tu DNI y contraseña.'}</p></div>
<form class="sheet" data-f="${setup?'setup':signup?'signup':'login'}"><h2>${setup?'Crear administrador':signup?'Registro de usuario':'Iniciá sesión'}</h2>${setup||signup?fld('Nombre completo','name','text','required autocomplete="name"'):''}${fld('Usuario o DNI','dni','text','required inputmode="numeric" autocomplete="username"')}${signup?sel('Tipo de cuenta','role','<option value="estudiante">Estudiante</option><option value="coordinador">Coordinador</option><option value="admin">Administrador</option>'):''}${setup?fld('Código de administrador','code','password','required inputmode="numeric" maxlength="4"'):''}${signup?fld('Código de autorización (solo coordinador/administrador)','code','password','inputmode="numeric" maxlength="4"'):''}${fld('Contraseña','pw','password','required minlength="6" autocomplete="'+(setup||signup?'new-password':'current-password')+'"')}<button class="btn">${setup||signup?'Crear cuenta':'Ingresar'}</button>${!setup?`<button type="button" class="btn b2" data-a="${signup?'showlogin':'showsignup'}">${signup?'Ya tengo una cuenta · Iniciar sesión':'Crear otra cuenta'}</button>`:''}<p class="m row" style="justify-content:center;gap:6px">${ic('lock',16)}Contraseñas cifradas · sesión temporal de 8 h</p></form></div>`}
const NAV={estudiante:[['agenda','Excursiones y horarios','cal'],['fiestas','Noches','note']],coordinador:[['agenda','Horarios','cal'],['fiestas','Noches','note'],['grupo','Grupos','users'],['n','Avisos','bell']],admin:[['agenda','Agenda','cal'],['fiestas','Noches','note'],['grupo','Grupos','users'],['u','Usuarios','users'],['t','Viajes','map'],['n','Avisos','bell'],['r','Reportes','chart']]};
function shell(U,body){const it=NAV[U.role];return `<main><div class="hd"><div><h2>${E(U.name.split(' ')[0])}</h2><p class="m">${ROL[U.role]}</p></div><div class="row" style="gap:8px">${themeButton()}<button class="btn b2 sm" data-a="out">Salir</button></div></div>${body}</main>${it.length>1?`<nav class="nav" aria-label="Principal"><div>${it.map(([k,l,i])=>`<button data-a="tab" data-k="${k}"${tab===k?' class="on" aria-current="page"':''}><i>${ic(i)}</i>${l}</button>`).join('')}</div></nav>`:''}`}
function studentOf(U){return U.role==='tutor'?S.u[U.link]:U}
function vHome(U){const s=studentOf(U),t=s&&S.t[s.trip];if(!t)return `<div class="card cp"><b>Todavía no hay un viaje asignado.</b><p class="m">Cuando el administrador te asigne uno, lo vas a ver acá.</p></div>`;
 const co=S.u[t.coord],d=s.docs||{},ns=vals('n').filter(n=>!n.trip||n.trip===t.id).sort((a,b)=>b.ts-a.ts);
