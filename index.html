<style>
:root{
  color-scheme:light;
  --bg:#F1F4FA;
  --ink:#0F1F4B;
  --mu:#526084;
  --ln:#DCE3F2;
  --card:#FFFFFF;
  --in:#B9C4DF;
  --soft:#E6ECF8;
  --okb:#D8F3EB;
  --okt:#085A48;
  --wb:#FFE6D5;
  --wt:#8C3905;
  --errb:#FEE4E2;
  --errt:#912018;
  --brand:#F26B21;
  --brand-h:#FF7D36;
  --navy:#0F1F4B;
  --navy-2:#192E6B;

  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#081029;
    --ink:#F0F4FC;
    --mu:#9BA8CC;
    --ln:#1F2D57;
    --card:#101B3E;
    --in:#38497D;
    --soft:#182756;
    --okb:#09382E;
    --okt:#8CE6CD;
    --wb:#45240E;
    --wt:#FFC49B;
    --errb:#4A1512;
    --errt:#FDA29B;
    --sh:0 6px 20px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#081029;
  --ink:#F0F4FC;
  --mu:#9BA8CC;
  --ln:#1F2D57;
  --card:#101B3E;
  --in:#38497D;
  --soft:#182756;
  --okb:#09382E;
  --okt:#8CE6CD;
  --wb:#45240E;
  --wt:#FFC49B;
  --errb:#4A1512;
  --errt:#FDA29B;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;line-height:1.12;letter-spacing:-.02em}
h1{font-size:32px}h2{font-size:22px}h3{font-size:17px}
p{margin:0}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease,background-color .15s ease,opacity .15s ease}
button:active{transform:scale(.98)}
#app{max-width:480px;margin:0 auto;min-height:100vh}
main{padding:18px 18px 116px;display:flex;flex-direction:column;gap:16px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:2px}
.hd-acts{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:6px 16px;box-shadow:var(--sh)}
.cp{padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.m{color:var(--mu);font-size:13.5px}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.ic{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.r{display:flex;align-items:center;gap:12px;padding:11px 0}
.r+.r{border-top:1px solid var(--ln)}
.g{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}

.b-danger{background:var(--errb);color:var(--errt);border:0;box-shadow:none}
.sm{min-height:38px;width:auto;padding:0 13px;font-size:13px;border-radius:11px}

.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13.5px}
.in{min-height:48px;border:1.5px solid var(--in);border-radius:13px;padding:0 14px;font:400 15px Inter,sans-serif;color:var(--ink);background:var(--card);width:100%;transition:border-color .15s ease,box-shadow .15s ease}

.pl{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font:600 12px Inter,sans-serif;border:0}
.pb{min-height:38px;padding:0 12px}
.ok{background:var(--okb);color:var(--okt)}
.wt{background:var(--wb);color:var(--wt)}
.err{background:var(--errb);color:var(--errt)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--ln);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:5;backdrop-filter:blur(10px)}
.nav>div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;min-height:50px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px Inter,sans-serif;color:var(--mu)}
.nav i{width:52px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;transition:background-color .15s ease}
.nav .on{color:var(--ink)}
.nav .on i{background:var(--brand);color:#0F1F4B}
.qrbox{background:#fff;border-radius:22px;padding:16px;align-self:center;width:248px;max-width:100%;border:2px solid var(--ln);box-shadow:0 8px 20px rgba(15,31,75,.08)}

.cam{position:relative;border-radius:24px;overflow:hidden;background:#070E24;aspect-ratio:1/1;border:2px solid var(--ln)}
.cam video{width:100%;height:100%;object-fit:cover}
.cam-frame{position:absolute;inset:18%;border:2.5px solid var(--brand);border-radius:20px;box-shadow:0 0 0 999px rgba(7,14,36,.45);pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;font:600 14px Inter,sans-serif;z-index:20;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.login{min-height:100vh;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);display:flex;flex-direction:column;color:#fff}
.login .top{padding:44px 22px 26px;display:flex;flex-direction:column;gap:14px}
.sheet{margin-top:auto;background:var(--card);color:var(--ink);border-radius:28px 28px 0 0;padding:26px 20px 34px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
form{display:flex;flex-direction:column;gap:12px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-box{background:var(--soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat-box b{font:700 22px 'Space Grotesk',sans-serif}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog>div{height:100%;background:var(--brand);border-radius:99px;transition:width .3s ease}
.search-bar{position:relative}
.search-bar input{padding-left:40px}
.search-bar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.demo-box{background:var(--soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px dashed var(--in)}
</style>

const ls={
  g(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},

};

const H=async(d,p)=>{
  if(window.crypto&&crypto.subtle){
    try{
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d+':'+p));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){}
  }
  let h1=0xdeadbeef,h2=0x41c6ce57;
  const t=d+':'+p;
  for(let i=0;i<t.length;i++){
    const c=t.charCodeAt(i);
    h1=Math.imul(h1^c,2654435761);
    h2=Math.imul(h2^c,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'f'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16);
};

// Descarga nativa estándar compatible con cualquier navegador moderno y GitHub Pages
function dlf(filename,mime,content){
  try{
    const blob=new Blob([content],{type:mime+';charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},250);
    toast('Archivo descargado');
  }catch(e){
    toast('No se pudo descargar el archivo');
  }
}

const vals=o=>Object.values(S[o]||{});
const toast=t=>{
  document.querySelectorAll('.toast').forEach(el=>el.remove());
  const e=document.createElement('div');
  e.className='toast';
  e.setAttribute('role','status');
  e.textContent=t;
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),2600);
};
function wr(n,id,d){S[n][id]=d;ls.s('rb_s',S)}
function del(n,id){delete S[n][id];ls.s('rb_s',S)}
function toggleTheme(){
  const isDark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);

function init(){

    return;
  }
  if(!Object.keys(S.u).length){a.innerHTML=authView(1);return}
  const U=me();
  if(!U){a.innerHTML=authView(0);return}
  if(!NAV[U.role].some(x=>x[0]===tab))tab=NAV[U.role][0][0];
  const v={home:vHome,qr:vQR,scan:vScan,nov:vNov,u:vU,t:vT,n:vN,r:vR}[tab];
  a.innerHTML=shell(U,v(U));

function check(dni){
  const U=me(),p=S.u[dni];
  let ok=0,why='';
  if(!p||p.role!=='estudiante')why='No registrado como pasajero';
  else if(!S.t[p.trip])why='Sin viaje asignado';
  else if(U.trip&&U.trip!==p.trip)why='Pertenece a otro viaje';
  else if(!p.docs?.dni||!p.docs?.aut)why='Documentación incompleta';
  else ok=1;
  const id='l'+Date.now().toString(36);
  wr('l',id,{id,type:'scan',dni,trip:p?.trip||'',by:U.dni,ts:Date.now(),ok});
  flash={ok,why,p:p&&p.role==='estudiante'?p:null,dni};
  stopCam();
  render();
}

function stopCam(){
  if(cam){cam.s.getTracks().forEach(t=>t.stop());cam=null}
}

function loop(v){
  const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
  const tick=()=>{
    if(!cam)return;
    if(v.readyState>=2){
      c.width=v.videoWidth;
      c.height=v.videoHeight;
      x.drawImage(v,0,0);
      const r=typeof jsQR!=='undefined'&&jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
      if(r&&r.data.startsWith('RB1|')){check(r.data.split('|')[1]);return}
    }
    requestAnimationFrame(tick);
  };
  tick();
}

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target.dataset.f,d=Object.fromEntries(new FormData(e.target)),U=me(),id='x'+Date.now().toString(36);
  if(f==='setup'||f==='login'){
    const dni=d.dni.trim();
    const h=await H(dni,d.pw);
    if(f==='setup'){
      wr('u',dni,{dni,name:d.name.trim(),role:'admin',h,docs:{}});
    }else if(S.u[dni]?.h!==h){
      return toast('Usuario o contraseña incorrectos');
    }
    sess={d:dni,e:Date.now()+288e5};
    ls.s('rb_me',sess);
    tab='';flash=null;
    return render();
  }
  if(f==='user'){
    const k=d.dni.trim();
    if(S.u[k])return toast('Ya existe un usuario con ese DNI');
    wr('u',k,{dni:k,name:d.name.trim(),role:d.role,trip:d.trip,link:d.link.trim(),h:await H(k,d.pw),docs:{}});
    toast('Usuario creado correctamente');
  }
  if(f==='trip'){wr('t',id,{id,...d});toast('Viaje creado')}
  if(f==='not'){wr('n',id,{id,...d,ts:Date.now()});toast('Aviso publicado')}
  if(f==='man')return check(d.dni.trim());
  if(f==='nov'){
    wr('l',id,{id,type:'nov',text:d.text.trim(),trip:U.trip||'',by:U.dni,ts:Date.now()});
    pre='';toast('Novedad registrada');
  }
  render();
});

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');
  if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='theme'){toggleTheme();return}
  if(a==='demo'){await loadDemo();return}
  if(a==='tab'){stopCam();flash=null;tab=b.dataset.k}
  else if(a==='out'){stopCam();sess=null;ls.d('rb_me');flash=null;tab=''}
  else if(a==='next'){flash=null}
  else if(a==='tonov'){pre=flash?.p?`Pasajero ${flash.p.name} (DNI ${flash.p.dni}): `:'';flash=null;tab='nov'}
  else if(a==='stop')stopCam();
  else if(a==='start'){
    try{cam={s:await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}}
    catch(x){toast('Cámara no disponible: usá el ingreso manual por DNI')}
  }
  else if(a==='delu'){if(confirm('¿Seguro que querés borrar este usuario?'))del('u',id)}
  else if(a==='delt'){if(confirm('¿Seguro que querés borrar este viaje?'))del('t',id)}
  else if(a==='deln')del('n',id);
  else if(a==='doc'){const u=S.u[id],k=b.dataset.k;wr('u',id,{...u,docs:{...u.docs,[k]:!u.docs?.[k]}})}
  else if(a==='exp'){dlf('roket-boarding-backup.json','application/json',JSON.stringify(S,null,2));return}
  else if(a==='csv'){
    const rows=[['Viaje','DNI','Nombre','DNI presentado','Autorización','Ficha médica','Abordó']];
    stats().forEach(s=>s.ps.forEach(p=>rows.push([s.t.dest,p.dni,p.name,p.docs?.dni?'Sí':'No',p.docs?.aut?'Sí':'No',p.docs?.med?'Sí':'No',s.bd2.has(p.dni)?'Sí':'No'])));
    dlf('reporte-roket-boarding.csv','text/csv','﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('
'));
    return;
  }
  render();
});

  if(e.target.id!=='imp')return;
  const f=e.target.files[0];

  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.u)throw 0;
      ['u','t','n','l'].forEach(k=>{S[k]={...S[k],...(d[k]||{})}});
      ls.s('rb_s',S);
      toast('Datos importados correctamente');
      render();
    }catch(x){toast('El archivo seleccionado no es válido')}
  };
  r.readAsText(f);
});

render();
init();
</script>
